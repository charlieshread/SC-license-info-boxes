<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Circles — Licence Pricing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.page{padding:1rem 0 2rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.step{margin-bottom:1.5rem}
.step-label{font-size:13px;color:#888;margin-bottom:.6rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;padding:6px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;color:#1a1a1a;cursor:pointer;transition:background .15s,border-color .15s,color .15s;line-height:1.4}
.pill:hover{background:#f5f5f5}
.pill.active{border-width:1.5px}
.divider{height:1px;background:#eee;margin:1.25rem 0}
.result-intro{font-size:13px;color:#666;margin-bottom:1.25rem;line-height:1.6;max-width:580px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:1.25rem}
.card{border:1px solid #e5e5e5;border-radius:12px;padding:1rem 1.1rem;background:#fff}
.card-use{font-size:11px;font-weight:600;color:#999;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.card-label{font-size:14px;font-weight:500;color:#1a1a1a;margin-bottom:8px;line-height:1.3}
.card-price{font-size:26px;font-weight:500;line-height:1;margin-bottom:4px}
.card-avg{font-size:11px;color:#aaa;margin-bottom:6px}
.card-detail{font-size:12px;color:#777;line-height:1.5}
.gs-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#666;margin-bottom:1.5rem}
.toggle-track{width:36px;height:20px;border-radius:10px;background:#e0e0e0;border:1px solid #ccc;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s}
.toggle-knob{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:2px;left:3px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle-track.on .toggle-knob{left:19px}
.cta-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;text-decoration:none;color:#fff;transition:opacity .15s}
.cta-btn:hover{opacity:.88}
.footnote{font-size:11px;color:#bbb;line-height:1.6;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid #eee}
.hidden{display:none}
.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<h2 class="sr-only">School Circles licence pricing — two-step selector</h2>

<div class="page">

  <!-- Step 1 -->
  <div class="step">
    <div class="step-label">Who are you?</div>
    <div class="btn-row" id="whoBar">
      <button class="pill" data-group="schools">Schools &amp; teachers</button>
      <button class="pill" data-group="universities">Universities &amp; colleges</button>
      <button class="pill" data-group="community">Community groups</button>
      <button class="pill" data-group="ngos">NGOs &amp; nonprofits</button>
      <button class="pill" data-group="companies">Businesses &amp; companies</button>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="step hidden fade-in" id="step2">
    <div class="step-label">How long do you need the licence?</div>
    <div class="btn-row" id="durationBar">
      <button class="pill" data-duration="onetime">One-time</button>
      <button class="pill" data-duration="annual">1 year</button>
      <button class="pill" data-duration="perpetual">Permanent</button>
    </div>
  </div>

  <!-- GS toggle -->
  <div class="gs-row hidden" id="gsRow">
    <div class="toggle-track" id="gsToggle"><div class="toggle-knob"></div></div>
    <span id="gsLabel">Based in the Global South?</span>
  </div>

  <!-- Result -->
  <div id="result"></div>

  <!-- Footnote -->
  <div class="footnote hidden" id="footnote">Prices are averages across audience/organization sizes, and specific license types. All prices in EUR.</div>

</div>

<script>
const data = {
  schools: {
    intro: "Schools and state schools can screen the film for a single class, a staff group, or a community event.",
    colors: {price:"#0F6E56", border:"#1D9E75", active:"#E1F5EE", btn:"#0F6E56"},
    onetime:    { std: {price:"€60–160",  avg:"avg. ~€80",  detail:"One-time public screening licences for schools and state schools. Price varies by audience size."},
                  gs:  {price:"€0–110",   avg:"avg. ~€30",  detail:"One-time public screening licences for schools and state schools. Some state school licences are free."} },
    annual:     { std: {price:"€65–190",  avg:"avg. ~€120", detail:"1-year public screening licences for schools and state schools."},
                  gs:  {price:"€45–140",  avg:"avg. ~€80",  detail:"1-year public screening licences for schools and state schools."} },
    perpetual:  { std: {price:"€110–320", avg:"avg. ~€200", detail:"Perpetual public screening licences for schools and state schools."},
                  gs:  {price:"€80–220",  avg:"avg. ~€140", detail:"Perpetual public screening licences for schools and state schools."} },
  },
  universities: {
    intro: "Universities can screen publicly at events or give the whole campus on-demand access via a digital site licence.",
    colors: {price:"#185FA5", border:"#378ADD", active:"#E6F1FB", btn:"#185FA5"},
    onetime:    { std: {price:"€150–400", avg:"avg. ~€270", detail:"One-time public screening licences for universities. Price varies by audience size."},
                  gs:  {price:"€100–280", avg:"avg. ~€190", detail:"One-time public screening licences for universities. Price varies by audience size."} },
    annual:     { std: {price:"€180–480", avg:"avg. ~€300", detail:"1-year public screening and 1-year digital site licences for universities."},
                  gs:  {price:"€120–340", avg:"avg. ~€210", detail:"1-year public screening and 1-year digital site licences for universities."} },
    perpetual:  { std: {price:"€300–800", avg:"avg. ~€600", detail:"Perpetual public screening and perpetual digital site licences for universities."},
                  gs:  {price:"€210–560", avg:"avg. ~€420", detail:"Perpetual public screening and perpetual digital site licences for universities."} },
  },
  community: {
    intro: "For grassroots groups, homeschoolers and other community groups hosting public screenings.",
    colors: {price:"#BA7517", border:"#EF9F27", active:"#FAEEDA", btn:"#BA7517"},
    onetime:    { std: {price:"€100–200", avg:"avg. ~€150", detail:"One-time public screening licences for community groups. Price varies by audience size."},
                  gs:  {price:"€70–140",  avg:"avg. ~€100", detail:"One-time public screening licences for community groups. Price varies by audience size."} },
    annual:     { std: {price:"€150–250", avg:"avg. ~€200", detail:"1-year public screening licences for community groups."},
                  gs:  {price:"€100–180", avg:"avg. ~€140", detail:"1-year public screening licences for community groups."} },
    perpetual:  { std: {price:"€250–450", avg:"avg. ~€350", detail:"Perpetual public screening licences for community groups."},
                  gs:  {price:"€180–320", avg:"avg. ~€240", detail:"Perpetual public screening licences for community groups."} },
  },
  ngos: {
    intro: "NGOs can screen publicly for outreach and events, or use the film privately for staff training.",
    colors: {price:"#534AB7", border:"#7F77DD", active:"#EEEDFE", btn:"#534AB7"},
    onetime:    { std: {price:"€90–300",  avg:"avg. ~€175", detail:"One-time public screening and one-time internal training licences for NGOs. Public screenings are at the higher end of the range."},
                  gs:  {price:"€60–210",  avg:"avg. ~€120", detail:"One-time public screening and one-time internal training licences for NGOs. Public screenings are at the higher end of the range."} },
    annual:     { std: {price:"€140–420", avg:"avg. ~€255", detail:"1-year public screening and 1-year internal training licences for NGOs."},
                  gs:  {price:"€100–300", avg:"avg. ~€180", detail:"1-year public screening and 1-year internal training licences for NGOs."} },
    perpetual:  { std: {price:"€240–700", avg:"avg. ~€430", detail:"Perpetual public screening and perpetual internal training licences for NGOs."},
                  gs:  {price:"€170–490", avg:"avg. ~€300", detail:"Perpetual public screening and perpetual internal training licences for NGOs."} },
  },
  companies: {
    intro: "Companies can use the film for internal staff training, or screen it publicly as part of a community initiative or corporate event.",
    colors: {price:"#993C1D", border:"#D85A30", active:"#FAECE7", btn:"#993C1D"},
    onetime:    { std: {price:"€180–600", avg:"avg. ~€350", detail:"One-time public screening and one-time internal training licences for companies. Public screenings are at the higher end of the range."},
                  gs:  {price:"€120–420", avg:"avg. ~€240", detail:"One-time public screening and one-time internal training licences for companies. Public screenings are at the higher end of the range."} },
    annual:     { std: {price:"€290–900", avg:"avg. ~€530", detail:"1-year public screening and 1-year internal training licences for companies."},
                  gs:  {price:"€200–630", avg:"avg. ~€370", detail:"1-year public screening and 1-year internal training licences for companies."} },
    perpetual:  { std: {price:"€480–1500",avg:"avg. ~€880", detail:"Perpetual public screening and perpetual internal training licences for companies."},
                  gs:  {price:"€340–1050",avg:"avg. ~€620", detail:"Perpetual public screening and perpetual internal training licences for companies."} },
  }
};

const durationLabels = {
  onetime: "One-time",
  annual: "1-year",
  perpetual: "Permanent"
};

let activeGroup = null;
let activeDuration = null;
let gsOn = false;

function resetDuration() {
  activeDuration = null;
  gsOn = false;
  document.querySelectorAll('#durationBar .pill').forEach(b => { b.classList.remove('active'); b.style.cssText = ''; });
  document.getElementById('gsRow').classList.add('hidden');
  document.getElementById('result').innerHTML = '';
  document.getElementById('footnote').classList.add('hidden');
  const track = document.getElementById('gsToggle');
  track.classList.remove('on');
  track.style.background = '';
  document.getElementById('gsLabel').textContent = 'Based in the Global South?';
}

function showResult() {
  const g = data[activeGroup];
  const c = g.colors;
  const d = g[activeDuration];
  const item = gsOn ? d.gs : d.std;
  document.getElementById('gsRow').classList.remove('hidden');
  document.getElementById('footnote').classList.remove('hidden');
  document.getElementById('result').innerHTML = `
    <div class="fade-in">
      <p class="result-intro">${g.intro}</p>
      <div class="cards">
        <div class="card">
          <div class="card-use">${durationLabels[activeDuration]} licence</div>
          <div class="card-price" style="color:${c.price}">${item.price}</div>
          <div class="card-avg">${item.avg}</div>
          <div class="card-detail">${item.detail}</div>
        </div>
      </div>
      <a href="https://license.schoolcirclesfilm.com/" target="_blank" rel="noopener" class="cta-btn" style="background:${c.btn}">
        Choose a licence
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  `;
}

document.getElementById('whoBar').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  const group = btn.dataset.group;
  if (activeGroup === group) {
    activeGroup = null;
    btn.classList.remove('active');
    btn.style.cssText = '';
    document.getElementById('step2').classList.add('hidden');
    resetDuration();
    return;
  }
  activeGroup = group;
  const c = data[activeGroup].colors;
  document.querySelectorAll('#whoBar .pill').forEach(b => { b.classList.remove('active'); b.style.cssText = ''; });
  btn.classList.add('active');
  btn.style.borderColor = c.border;
  btn.style.color = c.price;
  btn.style.background = c.active;
  resetDuration();
  document.getElementById('step2').classList.remove('hidden');
  document.getElementById('step2').classList.add('fade-in');
});

document.getElementById('durationBar').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  const dur = btn.dataset.duration;
  if (activeDuration === dur) {
    activeDuration = null;
    btn.classList.remove('active');
    btn.style.cssText = '';
    gsOn = false;
    document.getElementById('gsRow').classList.add('hidden');
    document.getElementById('result').innerHTML = '';
    document.getElementById('footnote').classList.add('hidden');
    return;
  }
  activeDuration = dur;
  const c = data[activeGroup].colors;
  document.querySelectorAll('#durationBar .pill').forEach(b => { b.classList.remove('active'); b.style.cssText = ''; });
  btn.classList.add('active');
  btn.style.borderColor = c.border;
  btn.style.color = c.price;
  btn.style.background = c.active;
  showResult();
});

const track = document.getElementById('gsToggle');
const lbl = document.getElementById('gsLabel');
track.addEventListener('click', () => {
  if (!activeDuration) return;
  gsOn = !gsOn;
  track.classList.toggle('on', gsOn);
  track.style.background = gsOn ? data[activeGroup].colors.btn : '';
  lbl.textContent = gsOn ? 'Global South prices on' : 'Based in the Global South?';
  showResult();
});
</script>

</body>
</html>
